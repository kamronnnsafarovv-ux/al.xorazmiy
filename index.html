<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Dashboard</title>
    <!-- Chart.js (Grafiklar uchun) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome (Belgilar/Ikonkalar uchun) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #f4f7fe;
            --sidebar-color: #1b2559;
            --card-bg: #ffffff;
            --text-color: #2b3674;
            --text-secondary: #a3edda;
            --accent-color: #4318ff;
        }

        body {
            display: flex;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Sidebar Style */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-color);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin-bottom: 15px;
        }

        .sidebar ul li a {
            color: #a3b1cc;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .sidebar ul li a:hover, .sidebar ul li a.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* Main Content Style */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        /* Stats Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background-color: #f4f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: var(--accent-color);
        }

        .card-info h3 {
            font-size: 14px;
            color: #a3b1cc;
            font-weight: 500;
        }

        .card-info p {
            font-size: 22px;
            font-weight: bold;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        @media (max-width: 900px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Yon Panel (Sidebar) -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#" class="active"><i class="fa-solid fa-house"></i> Bosh sahifa</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-line"></i> Analitika</a></li>
            <li><a href="#"><i class="fa-solid fa-users"></i> Foydalanuvchilar</a></li>
            <li><a href="#"><i class="fa-solid fa-wallet"></i> Moliya</a></li>
            <li><a href="#"><i class="fa-solid fa-gear"></i> Sozlamalar</a></li>
        </ul>
    </div>

    <!-- Asosiy Kontent -->
    <div class="main-content">
        <!-- Yuqori panel -->
        <div class="header">
            <h1>Xush kelibsiz! 👋</h1>
            <div class="user-profile">
                <i class="fa-solid fa-bell" style="font-size: 20px; color: #a3b1cc; margin-right: 15px;"></i>
                <img src="https://via.placeholder.com/40" alt="User Avatar">
                <span>Administrator</span>
            </div>
        </div>

        <!-- Statistik Kartalar -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-dollar-sign"></i></div>
                <div class="card-info">
                    <h3>Jami daromad</h3>
                    <p>$34,500</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-shopping-cart"></i></div>
                <div class="card-info">
                    <h3>Buyurtmalar</h3>
                    <p>1,245</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-users"></i></div>
                <div class="card-info">
                    <h3>Mijozlar</h3>
                    <p>890</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon"><i class="fa-solid fa-eye"></i></div>
                <div class="card-info">
                    <h3>Tashriflar</h3>
                    <p>45.2K</p>
                </div>
            </div>
        </div>

        <!-- Grafiklar -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Oylik daromad dinamikasi</h3>
                <canvas id="lineChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Tashrif manbalari</h3>
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>
    </div>

    <!-- JavaScript - Grafiklar va Dinamika -->
    <script>
        // 1. Chiziqli Grafik (Line Chart)
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun'],
                datasets: [{
                    label: 'Daromad ($)',
                    data: [12000, 19000, 15000, 25000, 22000, 34500],
                    borderColor: '#4318ff',
                    backgroundColor: 'rgba(67, 24, 255, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } }
            }
        });

        // 2. Doira Grafik (Doughnut Chart)
        const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: ['Qidiruv', 'Ijtimoiy tarmoq', 'Direkt'],
                datasets: [{
                    data: [55, 30, 15],
                    backgroundColor: ['#4318ff', '#6ad2ff', '#eff4fb']
                }]
            },
            options: {
                responsive: true
            }
        });
    </script>
</body>
</html>
